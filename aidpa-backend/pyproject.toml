[project]
name = "aidpa"
version = "0.1.0"
description = "AI-Powered Data Pipeline Analyst"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.3",
    "fastapi[standard]>=0.136.3",
    "google-generativeai>=0.8.6",
    "jinja2>=3.1.6",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-google-genai>=4.2.7",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pandas>=3.0.3",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.3.post1",
    "sentry-sdk[fastapi]>=2.0.0",
    "sqlglot>=30.11.0",
    "structlog>=26.1.0",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
